<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Elite Ingenieros | Planillas de Liquidación RI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f3f3f3;
    }

    /* ENCABEZADO */
    header {
      display: flex;
      align-items: center;
      justify-content: center; /* centra horizontalmente */
      background-color: #f3f3f3;
      padding: 10px;
    }
    .logo {
        width: 55px;
        height: auto;
        margin-right: 10px;
      }
    header img {
      width: 60px;
      height: auto;
      margin-right: 15px;
    }
      header h2 {
        color: #004b2d;
        font-weight: bold;
      }

    /* TARJETAS */
    .card {
      background: #fff;
      margin: 15px;
      padding: 12px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .item { font-weight: bold; font-size: 18px; color: #222; margin-bottom: 5px; }
    .desc { font-size: 14px; color: #444; margin-bottom: 10px; }

    .valores {
      display: flex; justify-content: space-between;
      font-size: 14px; margin: 3px 0;
    }

    .cantidad-box {
      display: flex; align-items: center;
      margin: 10px 0;
    }

    .cantidad-box label { margin-right: 10px; font-weight: bold; }
    input[type="number"] {
      width: 90px;
      padding: 6px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 15px;
      text-align: center;
    }

    .totales {
      display: flex; justify-content: space-between;
      font-size: 14px; margin-top: 5px;
    }

    /* RESULTADOS */
    .resumen {
      background: #007f4f;
      color: white;
      font-weight: bold;
      border-radius: 8px;
      margin: 20px;
      padding: 20px;
      font-size: 18px;
    }

    .resumen div {
      display: flex; justify-content: space-between;
      margin: 8px 0;
    }

    footer {
      text-align: center;
      font-size: 13px;
      color: #555;
      margin-bottom: 20px;
    }
    .resumen span:last-child {
      float: right;
      text-align: right;
      max-width: 50%;
      overflow-wrap: break-word;
    }
        .resumen {
      background: #008c4a;
      color: white;
      padding: 15px;
      border-radius: 10px;
      margin-top: 20px;
      font-size: 16px;
      font-weight: bold;
      display: flex;
      flex-direction: column;
      gap: 6px;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.15);
    }
    
    .resumen div {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.3);
      padding-bottom: 3px;
    }
    
      .resumen div:last-child {
        border-bottom: none;
      }
      footer {
    background-color: #f3f3f3;
    padding: 10px 0;
    text-align: center;
    font-size: 13px;
    color: #333;
    margin-top: 20px;
    border-top: 1px solid #ccc;
  }
  
  .footer-container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  
  .footer-logo {
    width: 28px;
    height: auto;
  }
    header h2 {
  color: #004b2d;
  font-weight: bold;
  white-space: nowrap;  /* 🔹 evita que se divida en dos líneas */
  font-size: 20px;
}
   .footer-container {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
    margin-top: 20px;
  }
  
  .footer-logo {
    width: 60px;
    height: auto;
    margin-bottom: 5px;
  }
  
  .footer-text {
    font-size: 13px;
    color: #444;
  }
  
  .footer-text .frase {
    font-style: italic;
    color: #008c4a; /* Verde corporativo */
    font-weight: bold;
  }   
   .desc {
  font-size: 14px;
  color: #444;
  margin-bottom: 10px;
  text-align: justify;         /* 🔹 Alinea el texto como en un párrafo */
  line-height: 1.3;            /* 🔹 Altura de línea equilibrada */
  word-break: break-word;      /* 🔹 Evita que el texto se salga del borde */
  white-space: normal;         /* 🔹 Asegura que el texto se adapte al ancho */
  max-width: 100%;             /* 🔹 Se ajusta al ancho de la tarjeta */
} 
 .desc {
  font-size: 14px;
  color: #444;
  margin-bottom: 10px;
  text-align: left;           /* ✅ Alineado normal, sin espacios forzados */
  line-height: 1.3;
  word-break: break-word;
  white-space: normal;
  max-width: 100%;
}   
  </style>
</head>
<body>
      <header>
        <img src="elite.png" alt="Elite Ingenieros" class="logo">
        <h2>Planilla de Liquidación RI</h2>
      </header>
       <div style="text-align: right; margin: 10px;">
        <button onclick="limpiarTodo()" 
                style="background-color:#007f4f; color:white; border:none; 
                       padding:8px 16px; border-radius:6px; cursor:pointer;
                       font-weight:bold;">
          Limpiar Cantidades
        </button>
      </div>

  <div id="contenedor-items"></div>
     <div class="resumen">

    <div>
        <span>SUMA CANTIDADES:</span>
        <span id="sumaCantidades">0</span>
    </div>

    <div>
        <span>VALOR EPM:</span>
        <span id="totalCliente">$ 0</span>
    </div>

    <div>
        <span>I.V.A 19%:</span>
        <span id="valorIVA">$ 0</span>
    </div>

    <div>
        <span>TOTAL VALOR EPM + IVA:</span>
        <span id="totalConIVA">$ 0</span>
    </div>

</div>
      <footer>
      <div class="footer-container">
        <img src="elite.png" alt="Logo Elite Ingenieros" class="footer-logo">
        <div class="footer-text">
          <span>© 2025 Elite Ingenieros S.A.S.</span><br>
          <span class="frase">Pasión por lo que hacemos.</span>
        </div>
      </div>
    </footer>
  <script>
  const items = [
    { codigo:"200092", desc:"Medidor 1F-2H 120V - 5(60)A CL 1 BASICO MCPO.", cliente:62988, cuadrillaU:0, cuadrillaR:0 },
    { codigo:"200093", desc:"Medidor 1F-3H 120/240V - 5(60)A CL 1 BASICO MCPO.", cliente:80515, cuadrillaU:0, cuadrillaR:0 },
    { codigo:"210947", desc:"Interruptor 1p termomagnético de 20A - 10kA -enchufable.", cliente:15214, cuadrillaU:0, cuadrillaR:0 },
    { codigo:"211673", desc:"Tablero monofásico de 4 circuitos.", cliente:25386, cuadrillaU:0, cuadrillaR:0 },
    { codigo:"335931", desc:"Tablero de distribución de 4 circuitos 1f barrajes en aluminio estañado.", cliente:30307, cuadrillaU:0, cuadrillaR:0 },
    { codigo:"B01U/R", desc:"Instalación de breaker 20A, 10 kA, Monopolar.", cliente:6596, cuadrillaU:3977, cuadrillaR:3977 },
    { codigo:"B02U/R", desc:"Instalación de breaker 30A, 10 kA, Monopolar.", cliente:7255, cuadrillaU:4375, cuadrillaR:4375 },
    { codigo:"B03U/R", desc:"Suministro e instalación expuesta de cable flexible 3X10 AWG, tipo NM de cobre.", cliente:38655, cuadrillaU:20509, cuadrillaR:20509},
    { codigo:"B04U/R", desc:"Suministro e instalación expuesta de cable flexible 3x12 AWG, tipo NM cobre.", cliente:30778, cuadrillaU:15510, cuadrillaR:15510},
    { codigo:"B05U/R", desc:"Suministro e instalación de caja plástica empotrada 2x4,4x4 con tapa plus u octogonal.", cliente:13556, cuadrillaU:4940, cuadrillaR:5245},
    { codigo:"B06U/R", desc:"Suministro e instalación de caja metálica troquelada expuesta 2x4,4x4 con tapa plus u octogonal.", cliente:12516, cuadrillaU:7438, cuadrillaR:7527},
    { codigo:"B07U/R", desc:"Suministro e instalación expuesta de tomacorriente doble.", cliente:26176, cuadrillaU:105556, cuadrillaR:10905},
    { codigo:"B08U/R", desc:"Suministro e instalación expuesta de portalámparas de loza.", cliente:24050,cuadrillaU:9521, cuadrillaR:10002 },
    { codigo:"B09U/R", desc:"Suministro e instalación expuesta de interruptor manual(suiche).", cliente:31021, cuadrillaU:12277, cuadrillaR:12796},
    { codigo:"B10U/R", desc:"Declaración de cumplimiento RETIE.", cliente:128970, cuadrillaU:79522, cuadrillaR:79522},
    { codigo:"B11U/R", desc:"Instalación de aparatos(cajas,suiches,tomas,portalámparas).", cliente:8042, cuadrillaU:4860, cuadrillaR:4860},
    { codigo:"B12U/R", desc:"Retiro de aparatos(cajas,suiches,tomas,portalámparas.", cliente:7985, cuadrillaU:4374, cuadrillaR:4374},
    { codigo:"B13U/R", desc:"Suministro e instalación de alambre de cobre 10 AWG,THW.", cliente:10804, cuadrillaU:4830, cuadrillaR:4859},
    { codigo:"B14U/R", desc:"Suministro e instalación de alambre de cobre 12 AWG,THW..", cliente:5638, cuadrillaU:3960, cuadrillaR:4014 },
    { codigo:"B15U/R", desc:"Suministro e instalación expuesta de tomacorriente GFCI.", cliente:134487, cuadrillaU:263552, cuadrillaR:65888 },
    { codigo:"B16U/R", desc:"Suministro e instalación expuesta de cable flexible 4x12 AWG, tipo NM cobre.", cliente:41455, cuadrillaU:20865, cuadrillaR:20865},
    { codigo:"B17U/R", desc:"Instalación de tablero de distribución 4 circuitos expuesto o empotrado”.", cliente:110476, cuadrillaU:41562, cuadrillaR:45548 },
  ];

  const contenedor = document.getElementById("contenedor-items");

  items.forEach((it, i) => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="item">${it.codigo}</div>
      <div class="desc">${it.desc}</div>

      <div class="valores">
        <div>Valor Cliente:</div>
        <div>${formato(it.cliente)}</div>
      </div>

      <div class="cantidad-box">
        <label>Cantidad:</label>
        <input type="number" min="0" value="" id="cant-${i}">
      </div>

      <div class="totales">
        <div>Total Cliente:</div>
        <div id="totCliente-${i}"></div>
      </div>
    `;
    contenedor.appendChild(card);

    document.getElementById(`cant-${i}`).addEventListener("input", actualizar);
  });

  function formato(num) {
    return "$ " + num.toLocaleString("es-CO");
  }

  function actualizar() {

  let sumaCant = 0;
  let totalCli = 0;

    items.forEach((it, i) => {
      const cant = parseFloat(document.getElementById(`cant-${i}`).value) || 0;
      sumaCant += cant;

      const totCli = cant * it.cliente;
  

      totalCli += totCli;
     

      document.getElementById(`totCliente-${i}`).innerText = cant > 0 ? formato(totCli) : "";
    });

    const iva = totalCli * 0.19;
    const totalFinal = totalCli + iva;
    
    document.getElementById("sumaCantidades").innerText = sumaCant;
    
    document.getElementById("totalCliente").innerText =
      formato(totalCli);
    
    document.getElementById("valorIVA").innerText =
      formato(iva);
    
    document.getElementById("totalConIVA").innerText =
      formato(totalFinal);
  }
    function limpiarTodo() {
  // Poner todos los campos en blanco
  items.forEach((it, i) => {
    document.getElementById(`cant-${i}`).value = "";
    document.getElementById(`totCliente-${i}`).innerText = "";
  });

  // Resetear los totales
  document.getElementById("sumaCantidades").innerText = "0";
  document.getElementById("totalCliente").innerText = "$ 0";
  document.getElementById("valorIVA").innerText = "$ 0";
  document.getElementById("totalConIVA").innerText = "$ 0";
}
</script>
</body>
</html>
